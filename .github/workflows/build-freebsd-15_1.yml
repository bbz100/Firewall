name: Silicom bypass driver - FreeBSD 15.1 compile

on:
  workflow_dispatch:
  push:
    paths:
      - 'PxGxBP-SD_CD_.zip'
      - 'scripts/port_freebsd15.py'
      - '.github/workflows/build-freebsd-15_1.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract original Silicom FreeBSD sources
        run: |
          set -eu
          test -f PxGxBP-SD_CD_.zip
          unzip -p PxGxBP-SD_CD_.zip FreeBSD/BP_Control/bp_ctl-4.0.2.tar.gz > /tmp/bp_ctl-4.0.2.tar.gz
          tar -xzf /tmp/bp_ctl-4.0.2.tar.gz
          test -f bp_ctl-4.0.2/driver/bp_mod.c
          test -f bp_ctl-4.0.2/util/bpctl_util.c
      - name: Apply experimental FreeBSD 15.1 API migration
        run: |
          python3 scripts/port_freebsd15.py
          echo 'CWARNFLAGS+= -Wno-error=unused-but-set-variable' >> bp_ctl-4.0.2/driver/Makefile
      - name: Publish patched C sources, headers and build files
        run: |
          set -eu
          mkdir -p silicom
          cp -R bp_ctl-4.0.2/driver bp_ctl-4.0.2/util bp_ctl-4.0.2/include silicom/
          cp bp_ctl-4.0.2/license bp_ctl-4.0.2/readme.txt bp_ctl-4.0.2/release.txt bp_ctl-4.0.2/Makefile silicom/
          git add silicom/
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish experimentally ported Silicom FreeBSD 15.1 driver C sources'
            git push origin HEAD:main
          fi
      - name: Restore FreeBSD 15.1 kernel-source archive cache
        id: freebsd-src-cache
        uses: actions/cache@v4
        with:
          path: freebsd-src.txz
          key: freebsd-15.1-release-src-txz-v1
      - name: Download FreeBSD kernel sources on Ubuntu host (cache miss only)
        if: steps.freebsd-src-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 30 --output freebsd-src.txz https://download.freebsd.org/releases/amd64/amd64/15.1-RELEASE/src.txz
          tar -tJf freebsd-src.txz usr/src/sys/Makefile >/dev/null
      - name: Verify available kernel-source archive
        run: |
          test -s freebsd-src.txz
          tar -tJf freebsd-src.txz usr/src/sys/Makefile >/dev/null
      - name: Compile on FreeBSD 15.1 amd64 (do not load kernel module)
        uses: vmactions/freebsd-vm@v1
        with:
          release: '15.1'
          arch: amd64
          usesh: true
          run: |
            set -eu
            uname -a
            freebsd-version -ku
            if [ ! -f /usr/src/sys/Makefile ]; then
              tar -xpf freebsd-src.txz -C /
            fi
            echo '=== Compile userland tool ==='
            make -C bp_ctl-4.0.2/util
            echo '=== Compile kernel driver ==='
            make -C bp_ctl-4.0.2/driver
            echo '=== Result ==='
            ls -lh bp_ctl-4.0.2/util/bpctl_util bp_ctl-4.0.2/driver/bpmod.ko
      - name: Upload experimental binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: silicom-freebsd-15_1-experimental
          path: |
            bp_ctl-4.0.2/util/bpctl_util
            bp_ctl-4.0.2/driver/bpmod.ko
          if-no-files-found: error

      - name: VM smoke test - execute utility and attempt no-hardware module load
        uses: vmactions/freebsd-vm@v1
        with:
          release: '15.1'
          arch: amd64
          usesh: true
          run: |
            set -eu
            echo '=== Run user-space utility usage path ==='
            ./bp_ctl-4.0.2/util/bpctl_util || true
            echo '=== Attempt module load in disposable FreeBSD VM with no Silicom device ==='
            if kldload ./bp_ctl-4.0.2/driver/bpmod.ko; then
              echo 'Unexpected success: no Silicom bypass NIC is attached to the VM.'
              kldunload bpmod || true
              exit 1
            fi
            echo 'Module declined to load without matching physical device (expected).'
            kldstat -v | grep bpmod && { echo 'Module unexpectedly remained loaded'; exit 1; } || true
            dmesg | tail -30
