name: Silicom bypass driver - OPNsense 26.7 exact kernel compile

# Run manually only. Updating source or workflow must not create overlapping builds.
on:
  workflow_dispatch:

concurrency:
  group: opnsense-silicom-bpmod
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract original Silicom FreeBSD sources
        run: |
          set -eu
          test -f PxGxBP-SD_CD_.zip
          unzip -p PxGxBP-SD_CD_.zip FreeBSD/BP_Control/bp_ctl-4.0.2.tar.gz > /tmp/bp_ctl-4.0.2.tar.gz
          tar -xzf /tmp/bp_ctl-4.0.2.tar.gz
          test -f bp_ctl-4.0.2/driver/bp_mod.c
          test -f bp_ctl-4.0.2/util/bpctl_util.c
      - name: Apply experimental FreeBSD 15.1 API migration
        run: |
          python3 scripts/port_freebsd15.py
          echo 'CWARNFLAGS+= -Wno-error=unused-but-set-variable' >> bp_ctl-4.0.2/driver/Makefile
      - name: Publish patched C sources, headers and build files
        run: |
          set -eu
          mkdir -p silicom
          cp -R bp_ctl-4.0.2/driver bp_ctl-4.0.2/util bp_ctl-4.0.2/include silicom/
          cp bp_ctl-4.0.2/license bp_ctl-4.0.2/readme.txt bp_ctl-4.0.2/release.txt bp_ctl-4.0.2/Makefile silicom/
          git add silicom/
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish experimentally ported Silicom FreeBSD 15.1 driver C sources'
            git push origin HEAD:main
          fi
      - name: Cache exact OPNsense kernel sources (download once when cache persists)
        id: opnsense-src-cache
        uses: actions/cache@v4
        with:
          path: opnsense-src.tar.gz
          key: opnsense-src-1633399de9ddbceb1474b7c095eeb5ef8c2f9ca8-v1
      - name: Download pinned OPNsense kernel sources (cache miss only)
        if: steps.opnsense-src-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 30 --output opnsense-src.tar.gz https://codeload.github.com/opnsense/src/tar.gz/1633399de9ddbceb1474b7c095eeb5ef8c2f9ca8
          tar -tzf opnsense-src.tar.gz >/dev/null
      - name: Verify pinned OPNsense source archive
        run: |
          set -eu
          test -s opnsense-src.tar.gz
          tar -tzf opnsense-src.tar.gz | grep '/sys/Makefile$'
      - name: Compile against exact OPNsense kernel sources (do not load module)
        uses: vmactions/freebsd-vm@v1
        with:
          release: '15.1'
          arch: amd64
          usesh: true
          run: |
            set -eu
            uname -a
            freebsd-version -ku
            # Never accidentally build against stock FreeBSD headers.
            mkdir -p /usr/src
            tar -xzf opnsense-src.tar.gz --strip-components=1 -C /usr/src
            test -f /usr/src/sys/Makefile
            echo 'Source commit: 1633399de9ddbceb1474b7c095eeb5ef8c2f9ca8'
            echo '=== Compile userland tool ==='
            make -C bp_ctl-4.0.2/util
            echo '=== Compile kernel driver ==='
            make -C bp_ctl-4.0.2/driver
            echo '=== Result ==='
            ls -lh bp_ctl-4.0.2/util/bpctl_util bp_ctl-4.0.2/driver/bpmod.ko
            echo '=== VM non-loading binary sanity checks ==='
            file bp_ctl-4.0.2/driver/bpmod.ko bp_ctl-4.0.2/util/bpctl_util
            readelf -h bp_ctl-4.0.2/driver/bpmod.ko
            echo '=== Control utility with no Silicom hardware ==='
            ./bp_ctl-4.0.2/util/bpctl_util || true
            echo '=== No module loading: runtime safety review pending ==='
      - name: Upload experimental binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: silicom-freebsd-15_1-experimental
          path: |
            bp_ctl-4.0.2/util/bpctl_util
            bp_ctl-4.0.2/driver/bpmod.ko
          if-no-files-found: error
      - name: Disposable VM kernel-load smoke test (no Silicom hardware)
        uses: vmactions/freebsd-vm@v1
        with:
          release: '15.1'
          arch: amd64
          usesh: true
          run: |
            set -eu
            echo '=== WARNING: Generic FreeBSD VM kernel, OPNsense source-built module ==='
            uname -a
            echo '=== Kernel module load attempt; VM disposable ==='
            set +e
            timeout 40 kldload ./bp_ctl-4.0.2/driver/bpmod.ko
            result=$?
            set -e
            echo "kldload exit code: $result"
            echo '=== Post-load state ==='
            kldstat -v | grep bpmod || true
            dmesg | tail -35
            if [ "$result" -eq 0 ]; then
              echo 'Unexpected successful load without Silicom card'
              kldunload bpmod || true
              exit 1
            fi
            if [ "$result" -eq 124 ]; then
              echo 'Kernel module load hung (FAIL)'
              exit 1
            fi
            if kldstat -v | grep -q bpmod; then
              echo 'Module remained loaded despite error (FAIL)'
              exit 1
            fi
            echo 'Module rejected load without hardware, VM survived (PASS)'
